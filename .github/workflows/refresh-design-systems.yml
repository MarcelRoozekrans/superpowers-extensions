name: Refresh design systems

on:
  schedule:
    # Mondays 06:00 UTC — before the working week starts in EU/US
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DEST: plugins/ui-design-system/skills/ui-design-system/design-systems
      BRANCH: automation/refresh-design-systems
    steps:
      - uses: actions/checkout@v7

      - name: Refresh design systems from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/refresh-design-systems.sh

      # check-registries fails until every system on disk is in INDEX.md and
      # every indexed system is on disk. Indexing needs a category and a vibe
      # line, which is a judgement call, so the PR lists exactly what to do.
      - name: Write the PR body
        run: |
          index="$DEST/INDEX.md"
          to_index=""
          for dir in "$DEST"/*/; do
            name=$(basename "$dir")
            grep -qF "]($name/DESIGN.md)" "$index" || to_index+="- [ ] \`$name\` — add to a category in INDEX.md with a vibe line"$'\n'
          done
          to_drop=""
          for name in $(grep -oE '\]\([^)/]+/DESIGN\.md\)' "$index" | sed -E 's#^\]\(([^/]+)/.*#\1#'); do
            [ -d "$DEST/$name" ] || to_drop+="- [ ] \`$name\` — removed upstream: drop its INDEX.md row, or restore it as \`$name-archived/\` to keep it"$'\n'
          done

          {
            echo "## Automated refresh"
            echo
            echo "Opened by the scheduled \`refresh-design-systems\` workflow. It re-fetches every"
            echo "\`DESIGN.md\` from [VoltAgent/awesome-design-md](https://github.com/VoltAgent/awesome-design-md)"
            echo "(MIT) and applies upstream additions, removals, and content edits."
            echo
            echo "## Catalog changes to curate"
            echo
            if [ -z "$to_index$to_drop" ]; then
              echo "None: no systems were added or removed, so INDEX.md needs no change."
            else
              echo "\`check-registries\` fails until each item below is done. Update the"
              echo "\"<N> vendored design systems\" count in INDEX.md and everywhere it is published."
              echo
              printf '%s%s' "$to_index" "$to_drop"
            fi
            echo
            echo "## Review checklist"
            echo
            echo "- [ ] Spot-check changed \`DESIGN.md\` files for unexpected content; large delete-and-add patterns deserve a closer look than small edits"
            echo "- [ ] For each added system, decide whether it belongs in the catalog"
            echo
            echo "🤖 Opened by \`.github/workflows/refresh-design-systems.yml\`"
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md"

      # Pushes and PRs made with GITHUB_TOKEN do not trigger workflows, so the
      # PR would never get its required checks. A token minted from the release
      # bot GitHub App acts as the App, and its pushes trigger CI normally.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open PR with refreshed catalog
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          delete-branch: true
          commit-message: |
            chore(ui-design-system): refresh design system catalog from upstream

            Automated refresh from VoltAgent/awesome-design-md (MIT) via the
            scheduled refresh-design-systems workflow.
          title: 'chore(ui-design-system): refresh design system catalog from upstream'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            automation
            ui-design-system
