<!doctype html>
<meta charset="utf-8">
<title>Architecture scan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; each candidate is a schematic sheet with a before/after pair, prose kept to one line per field */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #1d2226; --muted: #5d6870; --rule: #d9dcd6;
  --accent: #2f6b5a; --accent-soft: #e2efe9; --leak: #c2372d; --warn: #9a6a12; --warn-soft: #f6ecd6;
  --deep: #1f2d33; --deep-ink: #eef3f1; --faint: #e9ebe6;
  --display: "Fraunces", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14181a; --surface: #1b2124; --ink: #e4e8e6; --muted: #98a3a8; --rule: #2f383c;
  --accent: #6fbfa4; --accent-soft: #1f3530; --leak: #ef7a6f; --warn: #e2b55c; --warn-soft: #3a3020;
  --deep: #cfe3dc; --deep-ink: #14201c; --faint: #252d30; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14181a; --surface: #1b2124; --ink: #e4e8e6; --muted: #98a3a8; --rule: #2f383c;
  --accent: #6fbfa4; --accent-soft: #1f3530; --leak: #ef7a6f; --warn: #e2b55c; --warn-soft: #3a3020;
  --deep: #cfe3dc; --deep-ink: #14201c; --faint: #252d30; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 980px; margin: 0 auto; padding-block: 40px 64px; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); font-weight: 650; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; line-height: 1.15; }
h2 { font-size: 1.35rem; }
.eyebrow { font: 500 .72rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-size: .85rem; }
header { display: grid; gap: 14px; }
.meta { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.k-mod { width: 16px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; }
.k-seam { width: 22px; border-top: 2px dashed var(--accent); }
.k-leak { width: 22px; border-top: 2px solid var(--leak); }
.k-deep { width: 16px; height: 12px; background: var(--deep); border-radius: 2px; }

.scope { display: grid; gap: 10px; }
.hot { display: grid; grid-template-columns: minmax(0, 1fr) 120px 3.5em; gap: 6px 12px; align-items: center; font-size: .85rem; }
.hot .bar { height: 8px; background: var(--accent); border-radius: 4px; }
.hot .n { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.recalled { font-size: .88rem; color: var(--muted); }
.recalled b { color: var(--ink); font-weight: 500; }

article { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font: 500 .72rem/1 var(--mono); padding: 5px 8px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); }
.b-strong { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.b-explore { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.b-spec { background: var(--faint); color: var(--muted); border-color: transparent; }
.files { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.panel { border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-x: auto; }
.panel .eyebrow { color: var(--muted); }
.panel.after .eyebrow { color: var(--accent); }

.fields { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.fields dt { font: 500 .72rem/1.9 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fields dd { margin: 0; }
.wins { margin: 0; padding-left: 1.1em; }
.adr { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: .88rem; }

/* cross-section */
.stack { display: grid; gap: 4px; }
.band { border-left: 4px solid var(--rule); background: var(--faint); padding: 6px 10px; font: 500 .7rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.band.thick { border-left-color: var(--accent); background: var(--deep); color: var(--deep-ink); padding: 34px 12px; }
/* mass diagram */
.mass { display: flex; gap: 22px; align-items: flex-end; justify-content: center; min-height: 200px; }
.mod { display: grid; gap: 3px; width: 92px; text-align: center; }
.mod .if { background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 3px; }
.mod .impl { background: var(--deep); border-radius: 3px; }
.mod small { font: 500 .66rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.top { border: 2px solid var(--accent); }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
pre.mermaid { margin: 0; background: transparent; }
</style>

<main>
  <header>
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{TITLE}}</h1>
    <div class="legend">
      <span><i class="k-mod"></i>module</span>
      <span><i class="k-seam"></i>seam</span>
      <span><i class="k-leak"></i>leak across a seam</span>
      <span><i class="k-deep"></i>deep module</span>
    </div>
  </header>

  <section class="scope" aria-labelledby="scope-h">
    <h2 id="scope-h">Where the scan looked</h2>
    {{SCOPE}}
  </section>

  <section aria-label="Candidates" style="display:grid;gap:28px">
    {{CANDIDATES}}
  </section>

  <section class="top" aria-labelledby="top-h" style="background:var(--surface);border-radius:10px;padding:22px;display:grid;gap:8px">
    <span class="eyebrow">Top recommendation</span>
    {{TOP}}
  </section>
</main>
{{MERMAID_SCRIPT}}
